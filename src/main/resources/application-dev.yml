# Perfil de desarrollo: activar con SPRING_PROFILES_ACTIVE=dev
# Mantiene el log de SQL que antes estaba activo en todos los entornos.
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
