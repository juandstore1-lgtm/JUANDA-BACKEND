server:
  port: ${PORT:8080}
  # Comprime las respuestas JSON grandes (solo si el cliente envía Accept-Encoding)
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://altaria.proxy.rlwy.net:20859/railway}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:iamijrkXvxfOdkFoTyLMQohDtVgmZGpj}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    # El log de SQL solo se activa con el perfil "dev" (application-dev.yml)
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
application:
